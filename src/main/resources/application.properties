spring.application.name=flowcolombia

# Base de datos Neon (PostgreSQL) - Usando variables de entorno
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-soft-tooth-atwmo4vz.c-9.us-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:neondb_owner}
spring.datasource.password=${DATABASE_PASSWORD:npg_UFevk8yVZ1xE}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# 🔥 Admin password (leer desde variable de entorno)
admin.password=${ADMIN_PASSWORD:FlowColombia2026*}

# 🔥 SendGrid API Key (leer desde variable de entorno)
sendgrid.api-key=${SENDGRID_API_KEY:}

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Límite de subida de archivos
spring.servlet.multipart.max-file-size=500KB
spring.servlet.multipart.max-request-size=2MB

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Caché de recursos (imágenes, CSS, JS)
spring.web.resources.cache.period=31536000
spring.web.resources.cache.cachecontrol.max-age=31536000

# Compresión Gzip (ya activada)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json