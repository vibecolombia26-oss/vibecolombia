spring.application.name=flowcolombia

# ============================================================
# Base de datos Neon (PostgreSQL) - Usando variables de entorno
# IMPORTANTE: no escribir credenciales aquí (el repo es público).
# ============================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ============================================================
# ACCESO AL PANEL - OBLIGATORIO, SIN VALOR POR DEFECTO
# ============================================================
# A propósito NO hay valor por defecto: si ADMIN_PASSWORD no está
# definida, la aplicación NO arranca ("Could not resolve placeholder").
#
# Antes existía un valor por defecto y ese valor está publicado en el
# repositorio: cualquier persona con acceso al código podía entrar al
# panel de administración. Mejor un arranque fallido que un panel abierto.
#
#   Local (PowerShell):  $env:ADMIN_PASSWORD = "<contraseña larga y única>"
#   Hosting:             definir ADMIN_PASSWORD en las variables de entorno
admin.password=${ADMIN_PASSWORD}

# 🔥 SendGrid API Key (leer desde variable de entorno)
sendgrid.api-key=${SENDGRID_API_KEY:}

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ============================================================
# POOL DE CONEXIONES - CLAVE PARA EL FREE TIER DE NEON
# ============================================================
# Neon solo suspende la compute (scale to zero, 5 min) cuando NO
# queda ninguna conexión abierta. Si el pool mantiene una conexión
# idle "para siempre" (minimum-idle > 0), Neon nunca duerme y el
# proyecto consume ~180 CU-hours/mes, agotando el free tier.
#
# minimum-idle=0 + idle-timeout bajo => el pool cierra TODAS las
# conexiones cuando no hay tráfico y Neon puede suspenderse.
# Coste: el primer request tras un rato inactivo paga el cold start
# de Neon (~0.5-2 s). Es un intercambio correcto para una tienda
# de bajo tráfico.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# Batching: menos round-trips al guardar productos con variantes
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# No loguear cada sentencia SQL (menos I/O, menos CPU en el servidor)
spring.jpa.show-sql=false

# ============================================================
# Límites de subida de archivos (AUMENTADO)
# ============================================================
# Se aumentaron los límites para evitar error "Maximum upload size exceeded"
# al subir imágenes en el módulo de administración de productos.
# - max-file-size: 20MB (tamaño máximo por archivo)
# - max-request-size: 50MB (tamaño máximo total de la solicitud)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# Caché de recursos (imágenes, CSS, JS)
spring.web.resources.cache.period=31536000
spring.web.resources.cache.cachecontrol.max-age=31536000

# Compresión Gzip (ya activada)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# ============================================================
# PROXY, SESIÓN Y COOKIES
# ============================================================
# Render (y cualquier PaaS) termina el TLS en un proxy. Sin esto,
# request.getRemoteAddr() devuelve la IP del proxy y el limitador de
# peticiones acabaría bloqueando a TODOS los visitantes como si
# fueran uno solo.
server.forward-headers-strategy=framework

# La sesión del panel caduca sola a los 30 minutos de inactividad.
server.servlet.session.timeout=30m

# La cookie de sesión no es accesible desde JavaScript y no viaja
# en peticiones iniciadas desde otros sitios (defensa CSRF extra).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# En producción con HTTPS, define SESSION_COOKIE_SECURE=true en el hosting.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# ============================================================
# ASISTENTE DE COMPRAS (DeepSeek)
# ------------------------------------------------------------
# La clave se lee SOLO en el servidor desde la variable de entorno
# DEEPSEEK_API_KEY. Nunca se envía al navegador.
#
#   Windows (PowerShell, sesión actual):
#     $env:DEEPSEEK_API_KEY = "sk-..."
#   Windows (permanente para el usuario):
#     [Environment]::SetEnvironmentVariable("DEEPSEEK_API_KEY", "sk-...", "User")
#   Linux / Docker:
#     export DEEPSEEK_API_KEY="sk-..."
#
# Si la variable está vacía, el asistente responde con el catálogo
# real en modo local (sin IA) y no rompe la tienda.
# ============================================================
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}
deepseek.max-tokens=${DEEPSEEK_MAX_TOKENS:400}
deepseek.timeout-seconds=${DEEPSEEK_TIMEOUT_SECONDS:25}

# ============================================================
# META (Píxel + API de Conversiones)
# ------------------------------------------------------------
# El ID del píxel es público: viaja en el HTML de la tienda.
# El token de la API de Conversiones es un SECRETO: se lee solo de
# la variable de entorno META_CAPI_TOKEN y NUNCA se escribe aquí
# (el repositorio es público).
#
#   Hosting:  definir META_CAPI_TOKEN en las variables de entorno
#   Local:    $env:META_CAPI_TOKEN = "EAA..."
#
# Si la variable está vacía, la tienda funciona igual: el píxel del
# navegador sigue midiendo y el backend simplemente no envía eventos.
# ============================================================
meta.pixel.id=28602483122785418
meta.capi.token=${META_CAPI_TOKEN:}
