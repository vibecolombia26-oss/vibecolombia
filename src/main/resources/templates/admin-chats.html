<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('Consultas')}"></head>
<body class="admin-body">

<div class="admin-shell">
    <div th:replace="~{fragments/admin-layout :: sidebar('chats')}"></div>

    <div class="admin-main">
        <header th:replace="~{fragments/admin-layout :: topbar('Consultas','Soporte')}"></header>

        <main class="admin-content">
            <div class="admin-section__head">
                <div>
                    <h2>Conversaciones de clientes</h2>
                    <p id="chatsResumen">Cargando conversaciones…</p>
                </div>
                <button type="button" class="admin-btn admin-btn--ghost admin-btn--sm" id="btnRefrescarChats">
                    Actualizar
                </button>
            </div>

            <div id="chatsContainer">
                <div class="admin-card admin-empty">Cargando conversaciones…</div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: confirmModal}"></div>

<script>
    // Sin polling: se carga al abrir, al responder y con el botón Actualizar
    // (o el Refrescar del header). Así no se mantiene despierta la BD.
    (function () {
        'use strict';

        var contenedor = document.getElementById('chatsContainer');
        var resumen = document.getElementById('chatsResumen');
        var btn = document.getElementById('btnRefrescarChats');

        function esc(texto) {
            return String(texto == null ? '' : texto)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function sesionExpirada() {
            contenedor.innerHTML = '<div class="admin-card admin-empty">Tu sesión expiró. <a href="/admin-login" style="color:#60a5fa;">Vuelve a entrar</a> para seguir viendo las consultas.</div>';
            resumen.textContent = 'Sesión expirada';
        }

        function cargarChats() {
            window.adminFetch('/api/chat/todos', { headers: { 'Accept': 'application/json' } })
                .then(function (r) {
                    // 401 JSON del SecurityConfig cuando la sesión ya no vale
                    if (r.status === 401 || r.redirected) { sesionExpirada(); return null; }
                    return r.ok ? r.json() : [];
                })
                .then(function (mensajes) {
                    if (mensajes === null) return;
                    mensajes = Array.isArray(mensajes) ? mensajes : [];

                    var agrupados = {};
                    mensajes.forEach(function (m) {
                        var clave = m.codigoPedido || 'Sin código';
                        if (!agrupados[clave]) agrupados[clave] = [];
                        agrupados[clave].push(m);
                    });

                    var totalConversaciones = 0;
                    var totalPendientes = 0;
                    var html = '';

                    Object.keys(agrupados).sort().forEach(function (codigo) {
                        var msgs = agrupados[codigo];
                        var sinResponder = msgs.filter(function (m) { return m.esCliente && !m.respuesta; }).length;
                        totalConversaciones++;
                        totalPendientes += sinResponder;

                        html += '<article class="admin-card chat-card" style="margin-bottom:12px;">';
                        html += '  <div class="chat-card__head">';
                        html += '    <div>';
                        html += '      <div class="chat-card__code">' + esc(codigo) + '</div>';
                        html += '      <div class="admin-muted">' + msgs.length + ' mensaje' + (msgs.length === 1 ? '' : 's') + '</div>';
                        html += '    </div>';
                        html += sinResponder > 0
                            ? '    <span class="ad-badge ad-badge--pendiente">' + sinResponder + ' sin responder</span>'
                            : '    <span class="ad-badge ad-badge--entregado">Al día</span>';
                        html += '  </div>';
                        html += '  <div class="chat-thread">';

                        msgs.forEach(function (m) {
                            var clase = m.esCliente ? 'chat-msg chat-msg--client' : 'chat-msg chat-msg--admin';
                            html += '<div class="' + clase + '"><span class="chat-bubble">' + esc(m.mensaje) + '</span></div>';
                        });

                        html += '  </div>';

                        if (sinResponder > 0) {
                            var id = msgs[0].id;
                            html += '  <div class="chat-reply">';
                            html += '    <label class="ad-sr" for="resp_' + id + '">Respuesta</label>';
                            html += '    <input class="admin-input" type="text" id="resp_' + id + '" placeholder="Escribe tu respuesta…" autocomplete="off">';
                            html += '    <button type="button" class="admin-btn admin-btn--primary admin-btn--sm" data-responder="' + id + '">Enviar</button>';
                            html += '  </div>';
                        }

                        html += '</article>';
                    });

                    contenedor.innerHTML = html || '<div class="admin-card admin-empty">No hay consultas por ahora.</div>';

                    resumen.textContent = totalConversaciones + ' conversación' + (totalConversaciones === 1 ? '' : 'es')
                        + (totalPendientes > 0
                            ? ' · ' + totalPendientes + ' mensaje' + (totalPendientes === 1 ? '' : 's') + ' sin responder'
                            : ' · todo al día');
                })
                .catch(function (error) {
                    console.error('No se pudieron cargar las consultas:', error);
                    contenedor.innerHTML = '<div class="admin-card admin-empty">No se pudieron cargar las consultas. Intenta con Actualizar.</div>';
                    resumen.textContent = 'Error de conexión';
                });
        }

        function responder(id) {
            var input = document.getElementById('resp_' + id);
            if (!input) return;
            var respuesta = input.value.trim();
            if (!respuesta) { input.focus(); return; }

            var boton = document.querySelector('[data-responder="' + id + '"]');
            if (boton) { boton.disabled = true; boton.textContent = 'Enviando…'; }

            var formData = new FormData();
            formData.append('respuesta', respuesta);

            window.adminFetch('/admin/responder/' + id, { method: 'POST', body: formData })
                .then(function () { cargarChats(); })
                .catch(function (error) {
                    console.error('No se pudo enviar la respuesta:', error);
                    if (boton) { boton.disabled = false; boton.textContent = 'Enviar'; }
                });
        }

        contenedor.addEventListener('click', function (event) {
            var boton = event.target.closest('[data-responder]');
            if (boton) responder(boton.getAttribute('data-responder'));
        });

        contenedor.addEventListener('keydown', function (event) {
            if (event.key !== 'Enter' || !event.target.matches('.chat-reply input')) return;
            var boton = event.target.parentElement.querySelector('[data-responder]');
            if (boton) responder(boton.getAttribute('data-responder'));
        });

        if (btn) btn.addEventListener('click', cargarChats);

        document.addEventListener('DOMContentLoaded', cargarChats);
    })();
</script>

</body>
</html>
