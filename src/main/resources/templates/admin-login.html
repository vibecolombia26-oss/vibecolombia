<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - FLOW COLOMBIA</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .login-box {
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #ff00ff;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.2);
        }

        h1 {
            color: #ff00ff;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #ccc;
            margin-bottom: 7px;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 2px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 18px;
        }

        input:focus {
            outline: none;
            border-color: #ff00ff;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #ff00ff, #cc00cc);
            color: #fff;
            border: none;
            border-radius: 25px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.4);
            transform: scale(1.02);
        }

        .error {
            color: #ff4444;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .success {
            color: #00ff88;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .flag {
            text-align: center;
            margin-top: 20px;
            color: #ffd700;
            font-size: 0.8rem;
        }

    </style>
</head>

<body>

<div class="login-box">

    <h1>🔒 Admin</h1>

    <p class="subtitle">
        FLOW COLOMBIA
    </p>

    <!--
        IMPORTANTE:
        Spring Security procesa este formulario en /admin/login.
    -->
    <form action="/admin/login" method="post">

        <label for="username">
            Usuario
        </label>

        <input
                type="text"
                id="username"
                name="username"
                placeholder="Usuario"
                autocomplete="username"
                required
        >

        <label for="password">
            Contraseña
        </label>

        <input
                type="password"
                id="password"
                name="password"
                placeholder="Contraseña"
                autocomplete="current-password"
                required
        >

        <button type="submit">
            Ingresar
        </button>

        <!-- Error de autenticación -->
        <p
                class="error"
                id="login-error"
                style="display: none;"
        >
            Usuario o contraseña incorrectos.
        </p>

    </form>

    <div class="flag">
        🇨🇴 Hecho en Colombia con orgullo
    </div>

</div>

<script>

    const params = new URLSearchParams(window.location.search);

    if (params.has("error")) {
        document.getElementById("login-error").style.display = "block";
    }

</script>

</body>
</html>
