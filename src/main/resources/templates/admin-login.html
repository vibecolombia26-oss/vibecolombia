<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - FLOW COLOMBIA</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0a0a0a; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:'Segoe UI',system-ui,sans-serif; }
        .login-box { background:rgba(20,20,20,0.9); border:2px solid #ff00ff; border-radius:20px; padding:40px; width:100%; max-width:400px; box-shadow:0 0 40px rgba(255,0,255,0.2); }
        h1 { color:#ff00ff; text-align:center; margin-bottom:10px; }
        .subtitle { color:#888; text-align:center; margin-bottom:30px; }
        input { width:100%; padding:12px; background:#111; border:2px solid #333; border-radius:10px; color:#fff; font-size:1rem; margin-bottom:15px; }
        input:focus { outline:none; border-color:#ff00ff; }
        button { width:100%; padding:14px; background:linear-gradient(45deg,#ff00ff,#cc00cc); color:#fff; border:none; border-radius:25px; font-weight:700; font-size:1rem; cursor:pointer; transition:all 0.3s; }
        button:hover { box-shadow:0 0 30px rgba(255,0,255,0.4); transform:scale(1.02); }
        .error { color:#ff4444; text-align:center; margin-top:10px; }
        .flag { text-align:center; margin-top:20px; color:#ffd700; font-size:0.8rem; }
    </style>
</head>
<body>
<div class="login-box">
    <h1>🔒 Admin</h1>
    <p class="subtitle">FLOW COLOMBIA</p>
    <form th:action="@{/admin/login}" method="post">
        <!-- 🔥 CSRF token -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="password" name="password" placeholder="Contraseña" required>
        <button type="submit">Ingresar</button>
        <p class="error" th:if="${param.error != null}" style="color:#ff4444; text-align:center; margin-top:10px;">Contraseña incorrecta</p>
        <p class="error" th:if="${param.logout != null}" style="color:#00ff00; text-align:center; margin-top:10px;">Sesión cerrada</p>
    </form>
    <div class="flag">🇨🇴 Hecho en Colombia con orgullo</div>
</div>
</body>
</html>
