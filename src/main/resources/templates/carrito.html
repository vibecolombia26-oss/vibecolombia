<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - FLOW COLOMBIA</title>
    <style>
        /* (Mantén tus estilos actuales) */
    </style>
</head>
<body>
<div class="container">
    <h1>🛒 Carrito de compras</h1>
    <div id="carritoContenido">
        <!-- Aquí se renderiza el carrito desde localStorage -->
    </div>
    <!-- 🔥 Confirmación de pedido (aparece después de comprar) -->
    <div id="confirmacionPedido" style="display:none; background:rgba(0,255,0,0.1); border:2px solid #00ff00; padding:20px; border-radius:12px; margin-top:20px;">
        <h2 style="color:#00ff00;">✅ ¡Pedido realizado con éxito!</h2>
        <p>Tu código de seguimiento es: <strong id="codigoSeguimiento" style="color:#ffd700;"></strong></p>
        <p>Recibirás un correo con los detalles de tu pedido.</p>
        <a href="/" class="btn">Seguir comprando</a>
    </div>
</div>
<script>
    // (Tu lógica actual del carrito)
    // Al finalizar la compra, muestra la confirmación:
    function mostrarConfirmacion(codigo) {
        document.getElementById('confirmacionPedido').style.display = 'block';
        document.getElementById('codigoSeguimiento').textContent = codigo;
        // Limpiar carrito
        localStorage.removeItem('carritoFlowColombia');
    }
</script>
</body>
</html>
