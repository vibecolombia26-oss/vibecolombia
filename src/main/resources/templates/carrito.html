<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - FLOW COLOMBIA</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background-color:#0a0a0a; color:#e0e0e0; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; }
        .container { max-width:1000px; margin:0 auto; padding:20px; }
        .header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; margin-bottom:30px; }
        .header h1 { color:#ff00ff; font-size:2rem; }
        .btn-back { padding:8px 20px; border:1px solid #00ffff; border-radius:25px; color:#00ffff; text-decoration:none; transition:0.3s; }
        .btn-back:hover { background:rgba(0,255,255,0.1); }

        .carrito-vacio { text-align:center; padding:60px 20px; color:#666; }
        .carrito-vacio .icono { font-size:4rem; display:block; margin-bottom:15px; }

        .carrito-item { background:rgba(20,20,20,0.8); border:1px solid rgba(255,0,255,0.2); border-radius:16px; padding:15px; margin-bottom:15px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; transition:0.3s; }
        .carrito-item:hover { border-color:#ff00ff; box-shadow:0 0 20px rgba(255,0,255,0.1); }
        .carrito-item img { width:80px; height:80px; border-radius:10px; object-fit:cover; border:2px solid rgba(255,0,255,0.3); }
        .carrito-item .info { flex:1; min-width:150px; }
        .carrito-item .info .nombre { color:#fff; font-weight:700; font-size:1.1rem; }
        .carrito-item .info .detalle { color:#888; font-size:0.85rem; margin:4px 0; }
        .carrito-item .info .precio { color:#00ffff; font-weight:700; font-size:1.2rem; }
        .carrito-item .cantidad { display:flex; align-items:center; gap:10px; }
        .carrito-item .cantidad button { background:transparent; color:#ff00ff; border:1px solid #ff00ff; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:1.1rem; transition:0.3s; }
        .carrito-item .cantidad button:hover { background:rgba(255,0,255,0.15); box-shadow:0 0 15px rgba(255,0,255,0.3); }
        .carrito-item .cantidad span { color:#fff; font-weight:600; min-width:30px; text-align:center; font-size:1.1rem; }
        .carrito-item .eliminar { background:#ff0044; color:#fff; border:none; padding:6px 16px; border-radius:20px; cursor:pointer; transition:0.3s; font-weight:600; }
        .carrito-item .eliminar:hover { box-shadow:0 0 25px rgba(255,0,68,0.5); transform:scale(1.05); }

        .resumen { background:rgba(20,20,20,0.95); border:2px solid #ffd700; border-radius:16px; padding:25px; margin-top:25px; text-align:center; }
        .resumen .total-label { color:#aaa; font-size:0.9rem; text-transform:uppercase; letter-spacing:2px; }
        .resumen .total { font-size:2.5rem; color:#00ffff; font-weight:900; text-shadow:0 0 30px rgba(0,255,255,0.3); }
        .btn-pagar { display:inline-block; padding:14px 50px; background:linear-gradient(45deg,#ffd700,#f0a500); color:#000; border:none; border-radius:30px; font-weight:700; font-size:1.1rem; cursor:pointer; transition:0.3s; margin-top:15px; }
        .btn-pagar:hover { transform:scale(1.05); box-shadow:0 0 40px rgba(255,215,0,0.5); }

        .form-pago { display:none; background:rgba(20,20,20,0.95); border:2px solid #ff00ff; border-radius:16px; padding:30px; margin-top:20px; text-align:left; }
        .form-pago.active { display:block; animation:slideDown 0.4s ease; }
        @keyframes slideDown { 0% { opacity:0; transform:translateY(-20px); } 100% { opacity:1; transform:translateY(0); } }
        .form-pago h2 { color:#ff00ff; margin-bottom:20px; border-bottom:1px solid #333; padding-bottom:10px; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
        .form-group { margin-bottom:15px; }
        .form-group.full { grid-column:1/-1; }
        .form-group label { display:block; margin-bottom:5px; color:#00ffff; font-weight:600; font-size:0.85rem; }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:12px; background:#111; border:2px solid #333; border-radius:10px; color:#fff; font-size:1rem; transition:0.3s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:#ff00ff; box-shadow:0 0 15px rgba(255,0,255,0.2); }
        .form-group textarea { resize:vertical; min-height:80px; }
        .btn-enviar { width:100%; padding:14px; background:linear-gradient(45deg,#ff00ff,#cc00cc); color:#fff; border:none; border-radius:30px; font-weight:700; font-size:1.1rem; cursor:pointer; transition:0.3s; margin-top:10px; }
        .btn-enviar:hover { box-shadow:0 0 30px rgba(255,0,255,0.5); transform:scale(1.02); }
        .btn-enviar:disabled { opacity:0.6; cursor:not-allowed; }

        #confirmacionPedido { display:none; background:rgba(0,255,0,0.08); border:2px solid #00ff00; border-radius:16px; padding:30px; margin-top:25px; text-align:center; }
        #confirmacionPedido h2 { color:#00ff00; font-size:1.8rem; }
        #confirmacionPedido .codigo { color:#ffd700; font-size:1.8rem; font-weight:900; display:block; margin:10px 0; letter-spacing:2px; }
        #confirmacionPedido .btn { display:inline-block; margin-top:15px; padding:10px 30px; background:linear-gradient(45deg,#ff00ff,#cc00cc); color:#fff; border-radius:25px; text-decoration:none; font-weight:700; }

        .error-msg { color:#ff4444; font-size:0.85rem; margin-top:5px; display:none; }

        @media (max-width:768px) {
            .form-row { grid-template-columns:1fr; }
            .carrito-item { flex-direction:column; text-align:center; }
            .carrito-item .cantidad { justify-content:center; }
            .header h1 { font-size:1.5rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🛒 Carrito de compras</h1>
        <a href="/" class="btn-back">← Seguir comprando</a>
    </div>

    <div id="carritoContenido"></div>

    <div class="form-pago" id="formPago">
        <h2>📦 Datos de envío</h2>
        <form id="checkoutForm">
            <div class="form-row">
                <div class="form-group"><label>Nombre *</label><input type="text" id="nombre" required></div>
                <div class="form-group"><label>Apellido *</label><input type="text" id="apellido" required></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Celular *</label><input type="tel" id="celular" required></div>
                <!-- 🔥 ELIMINADO: campo de correo electrónico -->
            </div>
            <div class="form-row">
                <div class="form-group"><label>Departamento *</label>
                    <select id="departamento" required>
                        <option value="">Selecciona...</option>
                    </select>
                </div>
                <div class="form-group"><label>Municipio *</label>
                    <select id="municipio" required>
                        <option value="">Primero selecciona un departamento</option>
                    </select>
                </div>
            </div>
            <div class="form-group full"><label>Dirección *</label><input type="text" id="direccion" required></div>
            <div class="form-group full"><label>Notas adicionales</label><textarea id="notas" placeholder="Ej: Piso, código de acceso, referencias..."></textarea></div>
            <div class="error-msg" id="formError">⚠️ Por favor completa todos los campos obligatorios.</div>
            <button type="submit" class="btn-enviar" id="btnEnviarPedido">💵 Confirmar pedido</button>
        </form>
    </div>

    <div id="confirmacionPedido">
        <h2>✅ ¡Pedido realizado con éxito!</h2>
        <p>Tu código de seguimiento es:</p>
        <span class="codigo" id="codigoSeguimiento">---</span>
        <p>Te llegará un correo con los detalles.</p>
        <a href="/" class="btn">Seguir comprando</a>
    </div>
</div>

    // ============================================================
    // FUNCIONES DEL CARRITO
    // ============================================================

    function obtenerCarrito() {
        try {
            return JSON.parse(localStorage.getItem('carritoFlowColombia')) || [];
        } catch {
            return [];
        }
    }

    function guardarCarrito(carrito) {
        localStorage.setItem('carritoFlowColombia', JSON.stringify(carrito));
    }

    // 🔥 formatear precio con soporte para valores en miles (ej: 99 -> 99,000)
    function formatearPrecio(valor) {
        let num = Number(valor);
        if (isNaN(num)) return '0';
        if (num < 1000 && num > 0) num = num * 1000;
        return num.toLocaleString('es-CO');
    }

    function obtenerPrecioReal(valor) {
        let num = Number(valor);
        if (isNaN(num)) return 0;
        if (num < 1000 && num > 0) num = num * 1000;
        return num;
    }

    function renderizarCarrito() {
        const contenedor = document.getElementById('carritoContenido');
        const carrito = obtenerCarrito();

        if (carrito.length === 0) {
            contenedor.innerHTML = `
                <div class="carrito-vacio">
                    <span class="icono">🛒</span>
                    <p>Tu carrito está vacío</p>
                    <a href="/" style="color:#ff00ff;">Explorar productos</a>
                </div>
            `;
            document.getElementById('formPago').classList.remove('active');
            return;
        }

        let html = '';
        let total = 0;

        carrito.forEach((item, index) => {
            const precioReal = obtenerPrecioReal(item.precio);
            const cantidad = Number(item.cantidad) || 1;
            const subtotal = precioReal * cantidad;
            total += subtotal;

            // 🔥 Mostrar talla y color si existen
            const detalles = [];
            if (item.color) detalles.push('🎨 Color: ' + item.color);
            if (item.talla) detalles.push('👟 Talla: ' + item.talla);
            const detalleTexto = detalles.length ? '| ' + detalles.join(' ') : '';

            html += `
                <div class="carrito-item">
                    <img src="${item.imagen || ''}" alt="${item.nombre || 'Producto'}" onerror="this.src='https://via.placeholder.com/80?text=Producto'">
                    <div class="info">
                        <div class="nombre">${item.nombre || 'Producto'}</div>
                        <div class="detalle">${detalleTexto}</div>
                        <div class="precio">$${formatearPrecio(subtotal)}</div>
                    </div>
                    <div class="cantidad">
                        <button onclick="cambiarCantidad(${index}, -1)">−</button>
                        <span>${cantidad}</span>
                        <button onclick="cambiarCantidad(${index}, 1)">+</button>
                    </div>
                    <button class="eliminar" onclick="eliminarProducto(${index})">🗑️</button>
                </div>
            `;
        });

        html += `
            <div class="resumen">
                <p class="total-label">Total</p>
                <div class="total">$${formatearPrecio(total)}</div>
                <button class="btn-pagar" onclick="mostrarFormulario()">💵 Pagar contra entrega</button>
                <p style="color:#666; font-size:0.8rem; margin-top:8px;">Recibes, revisas y pagas al recibir</p>
            </div>
        `;

        contenedor.innerHTML = html;
        document.getElementById('formPago').classList.remove('active');
    }

    function cambiarCantidad(index, delta) {
        const carrito = obtenerCarrito();
        if (index < 0 || index >= carrito.length) return;
        const nuevaCantidad = (Number(carrito[index].cantidad) || 1) + delta;
        if (nuevaCantidad < 1) return;
        carrito[index].cantidad = nuevaCantidad;
        guardarCarrito(carrito);
        renderizarCarrito();
    }

    function eliminarProducto(index) {
        const carrito = obtenerCarrito();
        if (index < 0 || index >= carrito.length) return;
        carrito.splice(index, 1);
        guardarCarrito(carrito);
        renderizarCarrito();
    }

    // ============================================================
    // FORMULARIO DE PAGO
    // ============================================================

    function mostrarFormulario() {
        const carrito = obtenerCarrito();
        if (carrito.length === 0) {
            alert('El carrito está vacío');
            return;
        }
        document.getElementById('formPago').classList.add('active');
        document.getElementById('formPago').scrollIntoView({ behavior: 'smooth' });
    }

    function cargarDepartamentos() {
        const select = document.getElementById('departamento');
        select.innerHTML = '<option value="">Selecciona...</option>';
        Object.keys(colombia).sort().forEach(depto => {
            const opt = document.createElement('option');
            opt.value = depto;
            opt.textContent = depto;
            select.appendChild(opt);
        });
    }

    function cargarMunicipios(departamento) {
        const select = document.getElementById('municipio');
        select.innerHTML = '<option value="">Selecciona...</option>';
        if (departamento && colombia[departamento]) {
            colombia[departamento].sort().forEach(mun => {
                const opt = document.createElement('option');
                opt.value = mun;
                opt.textContent = mun;
                select.appendChild(opt);
            });
        }
    }

    document.getElementById('departamento').addEventListener('change', function() {
        cargarMunicipios(this.value);
    });

    document.getElementById('checkoutForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const errorEl = document.getElementById('formError');
        errorEl.style.display = 'none';

        const nombre = document.getElementById('nombre').value.trim();
        const apellido = document.getElementById('apellido').value.trim();
        const celular = document.getElementById('celular').value.trim();
        const departamento = document.getElementById('departamento').value;
        const municipio = document.getElementById('municipio').value;
        const direccion = document.getElementById('direccion').value.trim();
        const notas = document.getElementById('notas').value.trim();

        if (!nombre || !apellido || !celular || !departamento || !municipio || !direccion) {
            errorEl.style.display = 'block';
            return;
        }

        const carrito = obtenerCarrito();
        let total = 0;
        carrito.forEach(item => {
            total += obtenerPrecioReal(item.precio) * (Number(item.cantidad) || 1);
        });

        const productosTexto = carrito.map(item => {
            const precioReal = obtenerPrecioReal(item.precio);
            const subtotal = precioReal * (Number(item.cantidad) || 1);
            let detalle = `${item.nombre} x${item.cantidad}`;
            if (item.color) detalle += ` (Color: ${item.color})`;
            if (item.talla) detalle += ` (Talla: ${item.talla})`;
            detalle += ` - $${formatearPrecio(subtotal)}`;
            return detalle;
        }).join('\n');

        const pedido = {
            nombreCliente: nombre + ' ' + apellido,
            telefono: celular,
            // 🔥 Sin email
            departamento: departamento,
            ciudad: municipio,
            direccion: direccion,
            notas: notas || '',
            tienda: 'FlowColombia',
            productos: productosTexto,
            total: total,
            metodoPago: 'Contra entrega'
        };

        const btn = document.getElementById('btnEnviarPedido');
        btn.disabled = true;
        btn.textContent = '⏳ Enviando...';

        fetch('/api/pedido', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(pedido)
        })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'OK') {
                    mostrarConfirmacion(data.codigo);
                    localStorage.removeItem('carritoFlowColombia');
                    renderizarCarrito();
                    document.getElementById('formPago').classList.remove('active');
                } else {
                    alert('Error al procesar el pedido. Intenta de nuevo.');
                }
            })
            .catch(err => {
                alert('Error de conexión. Verifica tu internet.');
                console.error(err);
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = '💵 Confirmar pedido';
            });
    });

    function mostrarConfirmacion(codigo) {
        document.getElementById('confirmacionPedido').style.display = 'block';
        document.getElementById('codigoSeguimiento').textContent = codigo;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================
    // INICIALIZACIÓN
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {
        cargarDepartamentos();
        renderizarCarrito();
        const depto = document.getElementById('departamento').value;
        if (depto) cargarMunicipios(depto);
    });

    window.addEventListener('storage', (e) => {
        if (e.key === 'carritoFlowColombia') renderizarCarrito();
    });
</script>
