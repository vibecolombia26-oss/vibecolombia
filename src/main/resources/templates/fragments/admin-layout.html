<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' · FLOW COLOMBIA Admin'">Admin · FLOW COLOMBIA</title>
    <meta name="theme-color" content="#050914">

    <!-- ============================================================
         CSRF: token expuesto al JS del panel.
         Todas las llamadas fetch del admin pasan por window.adminFetch,
         que añade la cabecera automáticamente. Sin esto, los POST del
         panel (responder chat, borrados) serían rechazados por CSRF.
         ============================================================ -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <script>
        window.adminFetch = function (url, opciones) {
            var token = document.querySelector('meta[name="_csrf"]');
            var cabecera = document.querySelector('meta[name="_csrf_header"]');
            var opcionesFinales = Object.assign({ credentials: 'same-origin' }, opciones || {});
            var cabeceras = new Headers(opcionesFinales.headers || {});
            if (token && cabecera) {
                cabeceras.set(cabecera.getAttribute('content'), token.getAttribute('content'));
            }
            opcionesFinales.headers = cabeceras;
            return fetch(url, opcionesFinales);
        };
    </script>
    <style>
        /* ============================================================
           ADMIN — sistema visual compartido
           Azul noche #050914 · tarjetas #0d142e · acento #2563EB
           ============================================================ */
        :root {
            --ad-bg: #050914;
            --ad-surface: #0d142e;
            --ad-surface-2: #121b3a;
            --ad-border: rgba(255, 255, 255, 0.08);
            --ad-border-strong: rgba(255, 255, 255, 0.14);
            --ad-text: #ffffff;
            --ad-muted: #9aa4bf;
            --ad-muted-2: #6b7794;
            --ad-accent: #2563eb;
            --ad-accent-hover: #1d4ed8;
            --ad-accent-light: #60a5fa;
            --ad-accent-soft: rgba(37, 99, 235, 0.14);
            --ad-ok: #34d399;
            --ad-warn: #fbbf24;
            --ad-info: #60a5fa;
            --ad-danger: #f87171;
            --ad-radius: 16px;
            --ad-radius-sm: 10px;
            --ad-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --ad-sidebar: 260px;
            --ad-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.95);
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body.admin-body {
            margin: 0;
            min-height: 100vh;
            background: var(--ad-bg);
            color: var(--ad-text);
            font-family: var(--ad-font);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        body.admin-body a { color: inherit; text-decoration: none; }
        body.admin-body img { display: block; max-width: 100%; }
        body.admin-body h1, body.admin-body h2, body.admin-body h3, body.admin-body h4,
        body.admin-body p, body.admin-body ul { margin: 0; }
        body.admin-body ul { padding: 0; list-style: none; }

        .ad-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

        /* ============================================================
           SHELL
           ============================================================ */
        .admin-shell {
            display: grid;
            grid-template-columns: 1fr;
            min-height: 100vh;
        }

        @media (min-width: 1024px) {
            .admin-shell { grid-template-columns: var(--ad-sidebar) minmax(0, 1fr); }
        }

        /* ============================================================
           SIDEBAR
           ============================================================ */
        .admin-scrim {
            position: fixed;
            inset: 0;
            z-index: 295;
            background: rgba(2, 5, 15, 0.62);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        body.admin-sidebar-open .admin-scrim { opacity: 1; pointer-events: auto; }

        .admin-sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 300;
            width: min(282px, 86vw);
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px 16px;
            background: #071026;
            border-right: 1px solid var(--ad-border);
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            overflow-y: auto;
        }

        body.admin-sidebar-open .admin-sidebar { transform: none; }

        @media (min-width: 1024px) {
            .admin-sidebar {
                position: sticky;
                top: 0;
                height: 100vh;
                width: auto;
                transform: none;
            }
            .admin-scrim { display: none; }
        }

        .admin-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 6px 18px;
            border-bottom: 1px solid var(--ad-border);
        }

        .admin-brand__mark {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: linear-gradient(140deg, #2563eb 0%, #3b82f6 55%, #60a5fa 100%);
            color: #fff;
            font-weight: 900;
            font-size: 0.9rem;
            box-shadow: 0 10px 24px -12px rgba(37, 99, 235, 0.9);
            flex: none;
        }

        .admin-brand__text { display: flex; flex-direction: column; line-height: 1.2; }
        .admin-brand__text strong { font-size: 0.8rem; letter-spacing: 0.12em; }
        .admin-brand__text span { font-size: 0.68rem; color: var(--ad-muted-2); letter-spacing: 0.1em; text-transform: uppercase; }

        .admin-nav { display: grid; gap: 4px; }

        .admin-nav__link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid transparent;
            color: #b6c0d8;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .admin-nav__link svg { width: 17px; height: 17px; flex: none; color: #7f8bab; transition: color 0.2s ease; }
        .admin-nav__link:hover { background: rgba(255, 255, 255, 0.04); color: #fff; }
        .admin-nav__link:hover svg { color: var(--ad-accent-light); }

        .admin-nav__link.is-active {
            background: var(--ad-accent-soft);
            border-color: rgba(37, 99, 235, 0.45);
            color: #fff;
        }

        .admin-nav__link.is-active svg { color: var(--ad-accent-light); }

        .admin-nav__link.is-disabled { opacity: 0.5; cursor: not-allowed; }

        .admin-nav__soon {
            margin-left: auto;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ad-muted-2);
            border: 1px solid var(--ad-border);
            border-radius: 999px;
            padding: 2px 7px;
        }

        .admin-sidebar__foot { margin-top: auto; display: grid; gap: 10px; }

        .admin-store-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 14px;
            border-radius: 10px;
            background: var(--ad-accent);
            color: #fff;
            font-size: 0.82rem;
            font-weight: 600;
            box-shadow: 0 14px 28px -18px rgba(37, 99, 235, 0.95);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .admin-store-btn:hover { background: var(--ad-accent-hover); transform: translateY(-1px); }

        .admin-sidebar__note { font-size: 0.68rem; color: var(--ad-muted-2); text-align: center; }

        /* ============================================================
           TOPBAR
           ============================================================ */
        .admin-topbar {
            position: sticky;
            top: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 12px 16px;
            background: rgba(5, 9, 20, 0.87);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--ad-border);
        }

        @media (min-width: 768px) {
            .admin-topbar { padding: 14px 24px; }
        }

        .admin-topbar__lead { display: flex; align-items: center; gap: 12px; min-width: 0; }

        .admin-burger {
            width: 38px;
            height: 38px;
            flex: none;
            display: grid;
            place-items: center;
            border-radius: 10px;
            border: 1px solid var(--ad-border);
            background: rgba(255, 255, 255, 0.03);
            color: #dbe4ff;
            cursor: pointer;
        }

        .admin-burger:hover { border-color: rgba(37, 99, 235, 0.6); }

        @media (min-width: 1024px) { .admin-burger { display: none; } }

        .admin-topbar__eyebrow {
            font-size: 0.64rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ad-muted-2);
            margin-bottom: 2px;
        }

        .admin-topbar h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (min-width: 768px) { .admin-topbar h1 { font-size: 1.25rem; } }

        .admin-topbar__actions { display: flex; align-items: center; gap: 8px; }

        /* ============================================================
           CONTENIDO
           ============================================================ */
        .admin-content {
            width: 100%;
            max-width: 1320px;
            margin: 0 auto;
            padding: 20px 16px 52px;
        }

        @media (min-width: 768px) { .admin-content { padding: 28px 24px 64px; } }

        .admin-section { margin-bottom: 30px; }

        .admin-section__head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .admin-section__head h2 {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .admin-section__head p { font-size: 0.78rem; color: var(--ad-muted-2); }

        .admin-muted { color: var(--ad-muted-2); font-size: 0.78rem; }

        .admin-card {
            background: var(--ad-surface);
            border: 1px solid var(--ad-border);
            border-radius: var(--ad-radius);
        }

        /* ============================================================
           BOTONES
           ============================================================ */
        .admin-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--ad-text);
            font: 600 0.82rem/1.2 var(--ad-font);
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
        }

        .admin-btn svg { width: 15px; height: 15px; }

        .admin-btn--primary {
            background: var(--ad-accent);
            border-color: var(--ad-accent);
            color: #fff;
            box-shadow: 0 12px 26px -18px rgba(37, 99, 235, 0.95);
        }

        .admin-btn--primary:hover { background: var(--ad-accent-hover); border-color: var(--ad-accent-hover); }

        .admin-btn--ghost {
            background: rgba(255, 255, 255, 0.03);
            border-color: var(--ad-border-strong);
            color: #dbe4ff;
        }

        .admin-btn--ghost:hover { border-color: rgba(37, 99, 235, 0.6); background: var(--ad-accent-soft); }

        .admin-btn--danger {
            background: rgba(248, 113, 113, 0.12);
            border-color: rgba(248, 113, 113, 0.4);
            color: #fca5a5;
        }

        .admin-btn--danger:hover { background: rgba(248, 113, 113, 0.2); }

        .admin-btn--sm { padding: 7px 11px; font-size: 0.76rem; border-radius: 8px; }

        /* ============================================================
           ALERTAS Y KPIs
           ============================================================ */
        .alert-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 560px) { .alert-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (min-width: 1180px) { .alert-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

        .alert-card {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 18px;
            border-radius: var(--ad-radius);
            border: 1px solid var(--ad-border);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(13, 20, 46, 0.6) 100%);
            transition: border-color 0.22s ease, transform 0.22s ease, box-shadow 0.22s ease;
            min-height: 152px;
        }

        a.alert-card:hover {
            border-color: rgba(37, 99, 235, 0.55);
            transform: translateY(-2px);
            box-shadow: 0 22px 44px -30px rgba(37, 99, 235, 0.8);
        }

        .alert-card__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

        .alert-card__icon {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            border: 1px solid var(--ad-border-strong);
            background: rgba(255, 255, 255, 0.03);
            color: #c7d2fe;
        }

        .alert-card__icon svg { width: 18px; height: 18px; }

        .alert-card--warn .alert-card__icon { border-color: rgba(251, 191, 36, 0.4); background: rgba(251, 191, 36, 0.1); color: #fbbf24; }
        .alert-card--info .alert-card__icon { border-color: rgba(96, 165, 250, 0.4); background: rgba(96, 165, 250, 0.1); color: #93c5fd; }
        .alert-card--ok .alert-card__icon { border-color: rgba(52, 211, 153, 0.4); background: rgba(52, 211, 153, 0.1); color: #6ee7b7; }
        .alert-card--danger .alert-card__icon { border-color: rgba(248, 113, 113, 0.4); background: rgba(248, 113, 113, 0.1); color: #fca5a5; }

        .alert-card__label { font-size: 0.78rem; color: var(--ad-muted); }
        .alert-card__value { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.035em; line-height: 1; }
        .alert-card__value.is-muted { color: var(--ad-muted-2); }
        .alert-card__meta { margin-top: auto; font-size: 0.72rem; color: var(--ad-muted-2); display: flex; align-items: center; gap: 6px; }
        .alert-card__meta strong { color: var(--ad-accent-light); font-weight: 600; }

        .kpi-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 700px) { .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

        .kpi-card {
            padding: 18px;
            border-radius: var(--ad-radius);
            border: 1px solid var(--ad-border);
            background: var(--ad-surface);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .kpi-card__label { font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ad-muted-2); }
        .kpi-card__value { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em; }
        .kpi-card__value.is-muted { color: var(--ad-muted-2); font-size: 1.3rem; }
        .kpi-card__foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.74rem; color: var(--ad-muted-2); }
        .kpi-card__foot a { color: var(--ad-accent-light); }

        /* ============================================================
           BADGES / PILLS
           ============================================================ */
        .ad-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 9px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .ad-badge--pendiente { color: #fbbf24; background: rgba(251, 191, 36, 0.12); border-color: rgba(251, 191, 36, 0.35); }
        .ad-badge--procesando { color: #93c5fd; background: rgba(96, 165, 250, 0.12); border-color: rgba(96, 165, 250, 0.35); }
        .ad-badge--enviado { color: #67e8f9; background: rgba(34, 211, 238, 0.12); border-color: rgba(34, 211, 238, 0.35); }
        .ad-badge--entregado { color: #6ee7b7; background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.35); }
        .ad-badge--cancelado { color: #fca5a5; background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.35); }
        .ad-badge--neutral { color: var(--ad-muted-2); background: rgba(255, 255, 255, 0.04); border-color: var(--ad-border); }

        /* ============================================================
           TABLAS
           ============================================================ */
        .admin-table-wrap { overflow-x: auto; border-radius: var(--ad-radius); }

        .admin-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; min-width: 620px; }

        .admin-table th {
            text-align: left;
            padding: 11px 14px;
            font-size: 0.66rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ad-muted-2);
            border-bottom: 1px solid var(--ad-border);
            white-space: nowrap;
        }

        .admin-table td {
            padding: 11px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        .admin-table tr:last-child td { border-bottom: 0; }
        .admin-table tbody tr:hover td { background: rgba(255, 255, 255, 0.02); }

        .admin-thumb {
            width: 42px;
            height: 42px;
            border-radius: 9px;
            object-fit: cover;
            background: #0b1226;
            border: 1px solid var(--ad-border);
        }

        .admin-thumb--empty { display: grid; place-items: center; color: var(--ad-muted-2); font-size: 0.75rem; }

        .admin-empty {
            padding: 46px 20px;
            text-align: center;
            color: var(--ad-muted-2);
            font-size: 0.86rem;
        }

        /* ============================================================
           MODAL DE CONFIRMACIÓN
           ============================================================ */
        .admin-modal {
            position: fixed;
            inset: 0;
            z-index: 400;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(2, 5, 15, 0.72);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
        }

        .admin-modal.is-open { display: flex; }

        .admin-modal__card {
            width: min(440px, 100%);
            padding: 24px;
            border-radius: var(--ad-radius);
            border: 1px solid var(--ad-border-strong);
            background: var(--ad-surface);
            box-shadow: var(--ad-shadow);
        }

        .admin-modal__card h2 { font-size: 1.05rem; margin-bottom: 8px; }
        .admin-modal__card p { font-size: 0.86rem; color: var(--ad-muted); line-height: 1.55; margin-bottom: 18px; }
        .admin-modal__actions { display: flex; flex-direction: column; gap: 8px; }

        @media (min-width: 480px) {
            .admin-modal__actions { flex-direction: row; justify-content: flex-end; }
        }

        /* ============================================================
           FORMULARIOS (chats / filtros)
           ============================================================ */
        .admin-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 9px;
            border: 1px solid var(--ad-border-strong);
            background: rgba(255, 255, 255, 0.04);
            color: var(--ad-text);
            font: 400 0.86rem/1.4 var(--ad-font);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .admin-input::placeholder { color: var(--ad-muted-2); }
        .admin-input:focus { border-color: rgba(37, 99, 235, 0.7); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }

        .admin-alert {
            display: block;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid rgba(52, 211, 153, 0.4);
            background: rgba(52, 211, 153, 0.1);
            color: #a7f3d0;
            font-size: 0.84rem;
            margin-bottom: 18px;
        }

        .admin-main { min-width: 0; }

        body.admin-modal-open { overflow: hidden; }

        /* Las anclas del panel no deben quedar bajo el header sticky */
        [id="catalogo"] { scroll-margin-top: 84px; }

        /* ============================================================
           PEDIDOS
           ============================================================ */
        .orders-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            align-items: start;
        }

        @media (min-width: 1024px) {
            .orders-layout { grid-template-columns: 360px minmax(0, 1fr); gap: 18px; }
        }

        .orders-list {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            max-height: 460px;
        }

        @media (min-width: 1024px) {
            .orders-list { max-height: calc(100vh - 190px); min-height: 380px; }
        }

        .orders-filters {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 12px;
            border-bottom: 1px solid var(--ad-border);
        }

        .orders-filter {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 999px;
            border: 1px solid var(--ad-border);
            color: var(--ad-muted);
            font-size: 0.72rem;
            font-weight: 600;
            transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .orders-filter:hover { color: #fff; border-color: rgba(37, 99, 235, 0.5); }

        .orders-filter.is-active {
            color: #fff;
            background: var(--ad-accent-soft);
            border-color: rgba(37, 99, 235, 0.5);
        }

        .orders-filter .count {
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.62rem;
        }

        .orders-scroll { overflow-y: auto; padding: 8px; }

        .order-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease;
        }

        .order-item:hover { background: rgba(255, 255, 255, 0.03); }

        .order-item.is-active {
            background: var(--ad-accent-soft);
            border-color: rgba(37, 99, 235, 0.45);
        }

        .order-item:focus-visible { outline: 2px solid var(--ad-accent-light); outline-offset: 2px; }

        .order-item__dot {
            width: 7px;
            height: 7px;

    </style>
    <script defer th:inline="javascript">
        (function () {
            'use strict';

            var modal = null;
            var pendingTrigger = null;
            var lastFocus = null;

            function ensureModal() {
                if (modal) return modal;
                modal = document.getElementById('adminConfirm');
                if (!modal) return null;

                modal.addEventListener('click', function (event) {
                    if (event.target === modal || event.target.closest('[data-confirm-cancel]')) {
                        closeModal();
                    } else if (event.target.closest('[data-confirm-ok]')) {
                        confirmAction();
                    }
                });

                document.addEventListener('keydown', function (event) {
                    if (event.key === 'Escape' && modal.classList.contains('is-open')) closeModal();
                });

                return modal;
            }

            function openModal(trigger, message, title) {
                var el = ensureModal();
                if (!el) return;

                lastFocus = document.activeElement;
                pendingTrigger = trigger;

                var titleEl = el.querySelector('[data-confirm-title]');
                var textEl = el.querySelector('[data-confirm-text]');
                if (titleEl) titleEl.textContent = title || 'Confirmar acción';
                if (textEl) textEl.textContent = message || '¿Deseas continuar?';

                el.classList.add('is-open');
                document.body.classList.add('admin-modal-open');
                var ok = el.querySelector('[data-confirm-ok]');
                if (ok) ok.focus();
            }

            function closeModal() {
                if (!modal) return;
                modal.classList.remove('is-open');
                document.body.classList.remove('admin-modal-open');
                pendingTrigger = null;
                if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
            }

            function confirmAction() {
                var trigger = pendingTrigger;
                if (!trigger) { closeModal(); return; }

                modal.classList.remove('is-open');
                document.body.classList.remove('admin-modal-open');

                if (trigger.tagName === 'A') {
                    var href = trigger.getAttribute('href');
                    if (href) window.location.href = href;
                    return;
                }

                // Los botones de borrado del formulario de producto viven
                // DENTRO del formulario de edición (no se pueden anidar
                // formularios), así que apuntan a su propio formulario por id.
                var formId = trigger.getAttribute('data-confirm-form');
                var form = formId ? document.getElementById(formId) : trigger.closest('form');
                if (!form) { pendingTrigger = null; return; }

                if (formId) {
                    pendingTrigger = null;
                    form.submit();
                    return;
                }

                if (form.reportValidity && !form.reportValidity()) {
                    pendingTrigger = null;
                    return;
                }

                pendingTrigger = null;
                if (typeof form.requestSubmit === 'function') {
                    form.requestSubmit(trigger);
                } else {
                    form.submit();
                }
            }
            document.addEventListener('click', function (event) {
                var target = event.target;

                if (target.closest('[data-sidebar-toggle]')) {
                    event.preventDefault();
                    document.body.classList.toggle('admin-sidebar-open');
                    return;
                }

                if (target.closest('[data-sidebar-close]')) {
                    document.body.classList.remove('admin-sidebar-open');
                    return;
                }

                var trigger = target.closest('[data-confirm]');
                if (trigger) {
                    event.preventDefault();
                    openModal(trigger, trigger.getAttribute('data-confirm'), trigger.getAttribute('data-confirm-title'));
                }
            });
        })();
    </script>
</head>

<!-- ============================================================
     ASISTENTE IA DE ADMINISTRACIÓN
     ------------------------------------------------------------
     Habla con /api/admin/asistente usando Tool Calling de DeepSeek.
     Ningún cambio se aplica hasta que el administrador pulsa
     "Aprobar y Ejecutar" (segundo request con confirmarAccion).
     ============================================================ -->
<div th:fragment="asistenteAdmin">
    <button type="button" class="ad-ia-fab" data-ad-ia-toggle
            aria-label="Abrir asistente de administración">🤖</button>

    <section class="ad-ia-panel" id="adIaPanel" role="dialog"
             aria-label="Asistente de administración" hidden>
        <header class="ad-ia-head">
            <span class="ad-ia-head__mark" aria-hidden="true">🤖</span>
            <div class="ad-ia-head__text">
                <strong>Asistente IA</strong>
                <span>Stock · precios · descripciones</span>
            </div>
            <button type="button" class="ad-ia-close" data-ad-ia-close aria-label="Cerrar asistente">✕</button>
        </header>

        <div class="ad-ia-body" id="adIaBody" role="log" aria-live="polite"></div>

        <form class="ad-ia-form" id="adIaForm">
            <label class="ad-sr" for="adIaInput">Mensaje para el asistente</label>
            <input id="adIaInput" type="text" maxlength="500" autocomplete="off"
                   placeholder="Ej: sube el stock de MOCH-M a 20">
            <button type="submit" aria-label="Enviar mensaje">➤</button>
        </form>
    </section>
</div>

<script>
    // ============================================================
    // ASISTENTE IA DEL PANEL
    // ============================================================
    (function () {
        'use strict';

        var panel = document.getElementById('adIaPanel');
        var cuerpo = document.getElementById('adIaBody');
        var formulario = document.getElementById('adIaForm');
        var entrada = document.getElementById('adIaInput');
        if (!panel || !cuerpo || !formulario || !entrada) return;

        var historial = [];
        var ocupado = false;
        var iniciado = false;

        function abrir() {
            panel.hidden = false;
            if (!iniciado) {
                iniciado = true;
                burbuja('bot', 'Hola. Puedo buscar productos y proponer cambios de stock, precio o descripción. '
                    + 'Cada cambio te lo muestro antes de aplicarlo: nada se ejecuta sin tu aprobación.');
            }
            setTimeout(function () { entrada.focus(); }, 60);
        }

        function cerrar() { panel.hidden = true; }

        function alternar() { if (panel.hidden) abrir(); else cerrar(); }

        document.querySelectorAll('[data-ad-ia-toggle]').forEach(function (boton) {
            boton.addEventListener('click', alternar);
        });

        panel.querySelector('[data-ad-ia-close]').addEventListener('click', cerrar);

        document.addEventListener('keydown', function (evento) {
            if (evento.key === 'Escape' && !panel.hidden) cerrar();
        });

        function alFinal() { cuerpo.scrollTop = cuerpo.scrollHeight; }

        function burbuja(rol, texto) {
            var fila = document.createElement('div');
            fila.className = 'ad-ia-msg ad-ia-msg--' + rol;

            var textoBurbuja = document.createElement('div');
            textoBurbuja.className = 'ad-ia-bubble';
            textoBurbuja.textContent = texto;

            fila.appendChild(textoBurbuja);
            cuerpo.appendChild(fila);
            alFinal();
            return fila;
        }

        function tarjetaAprobacion(accion) {
            var tarjeta = document.createElement('div');
            tarjeta.className = 'ad-ia-action';

            var etiqueta = document.createElement('span');
            etiqueta.className = 'ad-ia-action__label';
            etiqueta.textContent = 'Cambio pendiente de aprobación';

            var detalle = document.createElement('span');
            detalle.className = 'ad-ia-action__text';
            detalle.textContent = 'Voy a ' + (accion.descripcion || 'aplicar un cambio') + '.';

            var boton = document.createElement('button');
            boton.type = 'button';
            boton.className = 'ad-ia-approve';
            boton.textContent = 'Aprobar y Ejecutar';
            boton.addEventListener('click', function () {
                boton.disabled = true;
                boton.textContent = 'Ejecutando…';
                enviar('Aprobado.', accion, boton);
            });

            tarjeta.appendChild(etiqueta);
            tarjeta.appendChild(detalle);
            tarjeta.appendChild(boton);
            cuerpo.appendChild(tarjeta);
            alFinal();
        }

        function ocupadoUI(valor) {
            ocupado = valor;
            entrada.disabled = valor;
            formulario.querySelector('button').disabled = valor;
            entrada.placeholder = valor ? 'Pensando…' : 'Ej: sube el stock de MOCH-M a 20';
        }

        function enviar(texto, accion, botonAprobar) {
            if (ocupado) return;

            var mensaje = (texto || '').trim();
            if (!mensaje) return;

            if (!accion) {
                burbuja('user', mensaje);
                entrada.value = '';
            }

            ocupadoUI(true);

            window.adminFetch('/api/admin/asistente', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({
                    mensaje: mensaje,
                    historial: historial.slice(-10),
                    confirmarAccion: !!accion,
                    accionPendiente: accion || null
                })
            })
                .then(function (respuesta) {
                    return respuesta.json()
                        .catch(function () { return {}; })
                        .then(function (datos) {
                            if (respuesta.status === 401 || respuesta.redirected) {
                                throw new Error('Tu sesión expiró. Vuelve a entrar al panel.');
                            }
                            if (!respuesta.ok) {
                                throw new Error((datos && datos.error) ? String(datos.error) : 'HTTP ' + respuesta.status);
                            }
                            return datos || {};
                        });
                })
                .then(function (datos) {
                    var textoRespuesta = datos.respuesta ? String(datos.respuesta) : 'Sin respuesta.';
                    burbuja('bot', textoRespuesta);

                    if (!accion) {
                        historial.push({ role: 'user', content: mensaje });
                        historial.push({ role: 'assistant', content: textoRespuesta });
                        if (historial.length > 12) historial = historial.slice(-12);
                    }

                    if (datos.requiereConfirmacion && datos.accion) {
                        tarjetaAprobacion(datos.accion);
                    }

                    if (datos.ejecutada) {
                        burbuja('bot', 'Cambio aplicado. Usa «Refrescar» arriba para verlo en el panel.');
                    }
                })
                .catch(function (error) {
                    burbuja('bot', '⚠ ' + (error && error.message ? error.message : 'No se pudo contactar al asistente.'));
                    if (botonAprobar) {
                        botonAprobar.disabled = false;
                        botonAprobar.textContent = 'Aprobar y Ejecutar';
                    }
                })
                .finally(function () {
                    ocupadoUI(false);
                    entrada.focus();
                });
        }

        formulario.addEventListener('submit', function (evento) {
            evento.preventDefault();
            enviar(entrada.value, null, null);
        });
    })();
</script>

</body>
</html>
