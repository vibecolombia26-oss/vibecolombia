<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ============================================================
     METADATOS COMPARTIDOS DE LAS PÁGINAS PÚBLICAS
     ------------------------------------------------------------
     Aquí vive lo que es igual en toda la tienda y no depende de la
     vista: verificación de dominio de Google Search Console y de
     Meta (Facebook).

     Uso, dentro del <head> de cada plantilla pública:
       <th:block th:replace="~{fragments/public-meta :: publicMeta}"></th:block>

     Por qué <th:block>: es un contenedor que Thymeleaf NO renderiza,
     así que el reemplazo inyecta únicamente las etiquetas <meta>. Un
     <div> o un <head> dentro del <head> sería HTML inválido.

     Duplicar meta de verificación es correcto: Search Console y Meta
     leen la que les corresponde. Google solo necesita la suya en la
     portada, pero se dejan en todas las vistas públicas para no
     depender de una página concreta.
     ============================================================ -->
<th:block th:fragment="publicMeta">
    <!-- Google Search Console -->
    <meta name="google-site-verification" content="vpz9nScZSVSBxjGN-qIJJG68hMBsdzP8NmMZ8R_S0u8" />

    <!-- Meta (Facebook) - Dominio futuro -->
    <meta name="facebook-domain-verification" content="eus43wbtavhmjwhc29khng8705x4pz" />

    <!-- Meta (Facebook) - Dominio Render actual -->
    <meta name="facebook-domain-verification" content="ff67agqhiiijtn3v58zvahsejh7tym" />

    <!-- ============================================================
         META PÍXEL - código base
         El ID del píxel es público (viaja en el HTML). El token de la
         API de Conversiones NO está aquí: vive en el servidor.
         La CSP de SecurityConfig permite connect.facebook.net; sin eso
         el navegador bloquearía el script.
         ============================================================ -->
    <script>
        !function (f, b, e, v, n, t, s) {
            if (f.fbq) return;
            n = f.fbq = function () {
                n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments)
            };
            if (!f._fbq) f._fbq = n;
            n.push = n;
            n.loaded = !0;
            n.version = '2.0';
            n.queue = [];
            t = b.createElement(e);
            t.async = !0;
            t.src = v;
            s = b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t, s)
        }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');

        fbq('init', '28602483122785418');
        fbq('track', 'PageView');
    </script>
    <noscript>
        <img height="1" width="1" style="display:none"
             alt=""
             src="https://www.facebook.com/tr?id=28602483122785418&amp;ev=PageView&amp;noscript=1" />
    </noscript>
</th:block>

</body>
</html>
